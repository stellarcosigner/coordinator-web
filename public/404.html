<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stellar Multisig Coordinator</title>
    <script>
      // GitHub Pages SPA fallback: Pages serves this file for any unknown path
      // (e.g. /requests/<id>). Hand the deep link to the real app via ?path= —
      // the fragment (which carries the transaction payload for signing) is
      // preserved through the redirect.
      (function () {
        var path = location.pathname + location.search;
        location.replace('/?path=' + encodeURIComponent(path) + location.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
